<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title data-i18n="title">万机 · 人工接管</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b101b;color:#f4f6fa}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 40% -10%,#1b2c46,#0b101b 55%)}
main{max-width:800px;margin:auto;padding:16px 13px 28px}
header{display:flex;align-items:center;gap:11px;margin:4px 0 15px}
.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#283a57;font-size:22px}
header strong{font-size:17px} header small{display:block;color:#9ba9ba;font-size:12px;margin-top:3px}
#state{margin-left:auto;font-size:12px;color:#8ed1ac;background:#19352e;border-radius:99px;padding:7px 11px;white-space:nowrap}
#window{margin:0 1px 9px;color:#dbe3f4;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen{background:#101824;border:1px solid #354761;border-radius:15px;overflow:hidden;min-height:210px;display:grid;place-items:center;position:relative;touch-action:none}
.screen img{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-drag:none}
.screen .empty{padding:35px 20px;text-align:center;color:#9ba9ba;line-height:1.8}
#notification{min-height:25px;color:#ffce82;font-size:12px;padding:8px 4px}
.panel{background:#151f30;border:1px solid #2a3a51;padding:13px;border-radius:15px;margin:9px 0}
h3{font-size:13px;color:#b7c7dc;margin:0 0 11px;font-weight:600}
.modes,.keys{display:flex;gap:7px;flex-wrap:wrap}
button{font:inherit;border:1px solid #3b516d;color:#e4ebf6;border-radius:10px;background:#25344a;padding:11px 13px;cursor:pointer;touch-action:manipulation}
button.selected{background:#3764b7;border-color:#81aaff;color:#fff}
button:disabled{opacity:.35}
.modes button{flex:1;font-size:13px;padding:11px 5px}
.type-row{display:flex;gap:8px}
.type-row input{min-width:0;flex:1;border:1px solid #50627c;outline:none;border-radius:10px;background:#0d1725;color:#fff;padding:11px;font-size:16px}
.type-row button{background:#3467bd;border-color:#4887ed}
.keys{margin-top:10px}.keys button{font-size:12px;padding:9px 11px}
.hint{font-size:12px;line-height:1.65;color:#9bacc1;margin:7px 2px 0}
.finish{display:block;width:100%;margin-top:16px;background:#2b8e68;border-color:#52b78b;font-size:16px;font-weight:650;padding:15px}
#done{display:none;text-align:center;padding:45px 17px}
#done h2{font-size:22px}#done p{color:#aab7ca;line-height:1.9}
</style>
</head>
<body>
<main id="main">
<header><div class="logo">🖥️</div><div><strong data-i18n="heading">人工接管</strong><small data-i18n="sub">万机 · 临时浏览器控制</small></div><span id="state" data-i18n="connecting">正在连接</span></header>
<div id="window" data-i18n="windowWait">连接电脑浏览器中…</div>
<div class="screen" id="screen"><div class="empty" id="empty" data-i18n="loadingFrame">正在读取电脑浏览器画面…</div><img id="frame" alt="电脑浏览器实时画面" data-i18n-alt="frameAlt" style="display:none"></div>
<div id="notification" role="status" aria-live="polite"></div>
<section class="panel"><h3 data-i18n="touch">触控方式</h3><div class="modes">
<button class="selected" data-mode="click" data-i18n="click">点击</button>
<button data-mode="scroll" data-i18n="scroll">滚动页面</button>
<button data-mode="drag" data-i18n="drag">拖拽滑块</button>
</div><div class="hint" data-i18n="modeHint">点击模式：轻点或长按；滚动模式：上下滑动；拖拽模式：从滑块起点划到终点。</div></section>
<section class="panel"><h3 data-i18n="typeTitle">输入到电脑浏览器</h3>
<div class="type-row"><input id="typing" autocomplete="off" spellcheck="false" placeholder="输入文字（不会保存在手机）" data-i18n-ph="typePh"><button id="send" data-i18n="send">发送</button></div>
<div class="keys"><button data-key="enter">Enter ↵</button><button data-key="tab">Tab ⇥</button><button data-key="backspace">⌫</button><button data-key="esc">Esc</button><button data-key="ctrl+a" data-i18n="selectAll">全选</button><button data-key="shift+tab" data-i18n="backTab">反向 Tab</button></div>
<p class="hint" data-i18n="typeHint">键盘输入会发送到电脑当前浏览器焦点处。隐私信息只在这次连接内传输。</p></section>
<button id="finish" class="finish" data-i18n="finish">✓ 验证完成 · 交还给 AI</button>
<div id="done"><h2 data-i18n="doneTitle">✅ 操作权已交还</h2><p data-i18n="doneText">这个临时接管链接已经失效。<br>回到 ChatGPT，发送「继续」即可。</p></div>
</main>
<script>
(() => {
'use strict';
const qs = id => document.getElementById(id);
// Language: ?lang=en or ?lang=zh wins; otherwise Chinese browsers get Chinese and everything else English.
const words = {
  zh: {
    title: '万机 · 人工接管', heading: '人工接管', sub: '万机 · 临时浏览器控制', connecting: '正在连接',
    windowWait: '连接电脑浏览器中…', loadingFrame: '正在读取电脑浏览器画面…', frameAlt: '电脑浏览器实时画面',
    touch: '触控方式', click: '点击', scroll: '滚动页面', drag: '拖拽滑块',
    modeHint: '点击模式：轻点或长按；滚动模式：上下滑动；拖拽模式：从滑块起点划到终点。',
    typeTitle: '输入到电脑浏览器', typePh: '输入文字（不会保存在手机）', send: '发送', selectAll: '全选', backTab: '反向 Tab',
    typeHint: '键盘输入会发送到电脑当前浏览器焦点处。隐私信息只在这次连接内传输。',
    finish: '✓ 验证完成 · 交还给 AI', doneTitle: '✅ 操作权已交还', doneText: '这个临时接管链接已经失效。<br>回到 ChatGPT，发送「继续」即可。',
    requestFailed: '请求失败', invalidState: '无效链接', invalidNote: '请从 GPT 返回的临时接管链接打开此页面。',
    expired: '连接已失效，请返回 GPT 重新请求接管', ended: '已结束', endedText: '临时链接已失效。返回 ChatGPT，发送「继续」即可。',
    frameFailed: '画面获取失败', connected: '已连接', paused: '画面暂停', confirm: '已经完成电脑上的验证，交还给 AI 吗？',
    doneNow: '临时链接已经失效。返回 ChatGPT，发送「继续」即可。'
  },
  en: {
    title: '万机 · Human takeover', heading: 'Human takeover', sub: '万机 · Temporary browser control', connecting: 'Connecting',
    windowWait: 'Connecting to the computer’s browser…', loadingFrame: 'Loading the computer’s browser picture…', frameAlt: 'Live picture of the computer’s browser',
    touch: 'Touch mode', click: 'Tap', scroll: 'Scroll page', drag: 'Drag slider',
    modeHint: 'Tap mode: tap or long-press. Scroll mode: swipe up or down. Drag mode: drag from the slider’s start to its end.',
    typeTitle: 'Type into the computer’s browser', typePh: 'Type text (not saved on this phone)', send: 'Send', selectAll: 'Select all', backTab: 'Shift+Tab',
    typeHint: 'Typing goes to wherever the computer’s browser currently has focus. Private information is only sent during this connection.',
    finish: '✓ Check done · hand back to the AI', doneTitle: '✅ Control handed back', doneText: 'This temporary takeover link has expired.<br>Go back to your AI app and send “continue”.',
    requestFailed: 'Request failed', invalidState: 'Invalid link', invalidNote: 'Open this page from the temporary takeover link your AI gave you.',
    expired: 'The connection has expired. Go back to your AI and ask for a takeover again', ended: 'Ended', endedText: 'This temporary link has expired. Go back to your AI app and send “continue”.',
    frameFailed: 'Couldn’t get the picture', connected: 'Connected', paused: 'Picture paused', confirm: 'Have you finished the check on the computer? Hand control back to the AI?',
    doneNow: 'This temporary link has expired. Go back to your AI app and send “continue”.'
  }
};
const wanted = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
const lang = wanted === 'en' || wanted === 'zh' ? wanted : (/^zh/i.test(navigator.language || '') ? 'zh' : 'en');
const T = k => words[lang][k];
document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
document.title = T('title');
document.querySelectorAll('[data-i18n]').forEach(el => { if (el.tagName !== 'TITLE') el.innerHTML = T(el.dataset.i18n); });
document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
document.querySelectorAll('[data-i18n-alt]').forEach(el => { el.alt = T(el.dataset.i18nAlt); });
const key = new URLSearchParams(location.hash.slice(1)).get('key');
history.replaceState(null, '', location.pathname + location.search);
let stopped = false, busy = false, mode = 'click', start = null, lastFrame = null;
let errors = 0;
const headers = { Authorization: 'Bearer ' + key };
const note = s => { qs('notification').textContent = s || ''; };
const state = s => { qs('state').textContent = s; };
const pause = ms => new Promise(r => setTimeout(r, ms));
const api = async (route, data) => {
  const res = await fetch('/handoff/api/' + route, {
    method: data === undefined ? 'GET' : 'POST',
    headers: data === undefined ? headers : { ...headers, 'Content-Type': 'application/json' },
    body: data === undefined ? undefined : JSON.stringify(data),
    cache: 'no-store', credentials: 'omit'
  });
  const result = await res.json();
  if (!res.ok) throw new Error(result.error || T('requestFailed'));
  return result;
};
if (!key || !/^[A-Za-z0-9_-]{30,}$/.test(key)) {
  stopped = true; state(T('invalidState')); note(T('invalidNote'));
}
const displayError = err => {
  const message = err?.message || String(err);
  note(message);
  if (/expired|unauthorized|Session/i.test(message)) end(T('expired'));
};
function end(message) {
  stopped = true; state(T('ended'));
  qs('done').style.display = 'block';
  qs('done').querySelector('p').textContent = message || T('endedText');
  [...qs('main').children].forEach(el => { if (el.id !== 'done') el.style.display = 'none'; });
}
async function refresh() {
  if (stopped || busy) return;
  busy = true;
  try {
    const res = await fetch('/handoff/api/frame', { headers, cache: 'no-store', credentials:'omit' });
    if (!res.ok) {
      const e = await res.json();
      throw new Error(e.error || T('frameFailed'));
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const img = qs('frame');
    await new Promise((resolve, reject) => {
      img.onload = resolve; img.onerror = reject; img.src = url;
    });
    img.style.display='block'; qs('empty').style.display='none';
    if (lastFrame) URL.revokeObjectURL(lastFrame);
    lastFrame=url; errors=0; state(T('connected')); note('');
  } catch (e) {
    errors++;
    displayError(e);
    if (errors > 3 && !stopped) state(T('paused'));
  } finally { busy=false; }
}
async function frames() {
  while (!stopped) { await refresh(); await pause(850); }
}
async function act(payload) {
  if (stopped) return;
  try { await api('input', payload); note(''); }
  catch(e) { displayError(e); }
}
function pos(event) {
  const r = qs('frame').getBoundingClientRect();
  return { x:Math.min(1, Math.max(0,(event.clientX-r.left)/r.width)), y:Math.min(1, Math.max(0,(event.clientY-r.top)/r.height)) };
}
qs('frame').addEventListener('pointerdown', e => {
  if(stopped) return;
  e.preventDefault(); start={...pos(e),t:Date.now()};
  qs('frame').setPointerCapture(e.pointerId);
});
qs('frame').addEventListener('pointerup', e => {
  if (!start || stopped) return;
  e.preventDefault();
  const a=start, b=pos(e); start=null;
  const move=Math.hypot(a.x-b.x,a.y-b.y);
  if(mode==='scroll') act({action:'scroll',...b,amount:Math.max(-10, Math.min(10,Math.round((a.y-b.y)*12))) || -1});
  else if(mode==='drag' && move>.01) act({action:'drag',...a,to_x:b.x,to_y:b.y});
  else act({action:Date.now()-a.t>700?'right_click':'click',...b});
});
qs('frame').addEventListener('pointercancel', () => { start=null; });
document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{
  mode=btn.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected', b===btn));
}));
document.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>act({action:'key',keys:btn.dataset.key})));
qs('send').addEventListener('click', async()=>{
  const input=qs('typing'); if (!input.value) return;
  await act({action:'type',text:input.value}); input.value='';
});
qs('typing').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();qs('send').click();}});
qs('finish').addEventListener('click',async()=>{
  if(stopped || !confirm(T('confirm'))) return;
  try { await api('finish', {}); end(T('doneNow')); }
  catch(e) { displayError(e); }
});
(async()=>{
  if(stopped) return;
  try { const s=await api('status'); qs('window').textContent=s.title; state(T('connected')); frames(); }
  catch(e){ displayError(e); }
})();
})();
</script>
</body>
</html>
